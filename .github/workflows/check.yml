name: PHP checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  syntax:
    name: PHP syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Run syntax checks
        run: sh scripts/check.sh
